services:

  app:
  
    image: gowmitha/node-mysql-app:1.0.0

    ports:
      - "${APP_PORT}:3000"

    environment:
      NODE_ENV: production

      PORT: 3000

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}

      DB_PASSWORD_FILE: /run/secrets/mysql_password

    secrets:
      - mysql_password

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped


  db:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}

      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password

    secrets:
      - mysql_root_password
      - mysql_password

    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$(cat /run/secrets/mysql_root_password) --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped


volumes:
  mysql_data:


secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt

  mysql_password:
    file: ./secrets/mysql_password.txt